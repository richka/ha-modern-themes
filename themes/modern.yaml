Modern Green:
  <<: *modern_base
  primary-color: "#00CB6A"
  rgb-primary-color: "0,203,106"
  dark-primary-color: "#00A053"
  darker-primary-color: "#00753D"
  light-primary-color: "#9CEBC5"
  accent-color: "#00F17D"
  rgb-accent-color: "0,241,125"
